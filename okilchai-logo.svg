<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#FAF8F4"/>

  <!-- Outer circle border -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#0F1F3D" stroke-width="2"/>

  <!-- Inner decorative circle -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#C8A84B" stroke-width="1"/>

  <!-- Scale beam (horizontal) -->
  <line x1="130" y1="175" x2="270" y2="175" stroke="#0F1F3D" stroke-width="2" stroke-linecap="round"/>

  <!-- Center vertical post -->
  <line x1="200" y1="145" x2="200" y2="270" stroke="#0F1F3D" stroke-width="2" stroke-linecap="round"/>

  <!-- Center pivot top ornament -->
  <circle cx="200" cy="145" r="5" fill="#C8A84B" stroke="#0F1F3D" stroke-width="1.5"/>

  <!-- Beam pivot circle (center of beam) -->
  <circle cx="200" cy="175" r="3.5" fill="#FAF8F4" stroke="#0F1F3D" stroke-width="1.5"/>

  <!-- Left pan chain -->
  <line x1="145" y1="175" x2="138" y2="205" stroke="#0F1F3D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="138" y1="205" x2="152" y2="205" stroke="#0F1F3D" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right pan chain -->
  <line x1="255" y1="175" x2="248" y2="205" stroke="#0F1F3D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="248" y1="205" x2="262" y2="205" stroke="#0F1F3D" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Left pan dish (arc) -->
  <path d="M130 205 Q145 218 160 205" fill="none" stroke="#0F1F3D" stroke-width="2" stroke-linecap="round"/>

  <!-- Right pan dish (arc) -->
  <path d="M240 205 Q255 218 270 205" fill="none" stroke="#0F1F3D" stroke-width="2" stroke-linecap="round"/>

  <!-- Left pan gold accent line -->
  <line x1="132" y1="205" x2="158" y2="205" stroke="#C8A84B" stroke-width="1" stroke-linecap="round"/>

  <!-- Right pan gold accent line -->
  <line x1="242" y1="205" x2="268" y2="205" stroke="#C8A84B" stroke-width="1" stroke-linecap="round"/>

  <!-- Base of post - footing left -->
  <line x1="200" y1="270" x2="175" y2="270" stroke="#0F1F3D" stroke-width="2" stroke-linecap="round"/>
  <!-- Base of post - footing right -->
  <line x1="200" y1="270" x2="225" y2="270" stroke="#0F1F3D" stroke-width="2" stroke-linecap="round"/>

  <!-- Base ornament gold dots -->
  <circle cx="175" cy="270" r="2.5" fill="#C8A84B"/>
  <circle cx="225" cy="270" r="2.5" fill="#C8A84B"/>

  <!-- Top beam end ornaments -->
  <circle cx="130" cy="175" r="3" fill="#C8A84B"/>
  <circle cx="270" cy="175" r="3" fill="#C8A84B"/>

  <!-- Outer ring gold tick marks (12 equally spaced) -->
  <g stroke="#C8A84B" stroke-width="1.2" stroke-linecap="round">
    <line x1="200" y1="42" x2="200" y2="50"/>
    <line x1="280" y1="62" x2="276" y2="69"/>
    <line x1="338" y1="120" x2="332" y2="124"/>
    <line x1="358" y1="200" x2="350" y2="200"/>
    <line x1="338" y1="280" x2="332" y2="276"/>
    <line x1="280" y1="338" x2="276" y2="331"/>
    <line x1="200" y1="358" x2="200" y2="350"/>
    <line x1="120" y1="338" x2="124" y2="331"/>
    <line x1="62" y1="280" x2="68" y2="276"/>
    <line x1="42" y1="200" x2="50" y2="200"/>
    <line x1="62" y1="120" x2="68" y2="124"/>
    <line x1="120" y1="62" x2="124" y2="69"/>
  </g>
</svg>
